<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="School Visit Management System - Sign in to your account.">
  <title>Login | School Visit Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div class="login-page">
    <div style="position:fixed;top:16px;right:16px;">
      <button class="icon-btn" id="themeToggleLogin" title="Toggle Dark Mode"><i class="bi bi-moon-fill"></i></button>
    </div>

    <div class="login-card">
      <div class="login-logo"><i class="bi bi-mortarboard-fill"></i></div>
      <h4>School Visit System</h4>
      <p class="login-sub">Village Technology School</p>

      <div id="loginError" class="alert alert-danger d-none fs-sm py-2 mb-3" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username"><i class="bi bi-person me-1"></i>Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password"><i class="bi bi-lock me-1"></i>Password</label>
          <div class="password-toggle-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Enter password" autocomplete="current-password" style="padding-right:40px;" required>
            <button type="button" class="toggle-eye" id="togglePassword" title="Show/Hide Password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="remember">
          <label class="form-check-label fs-sm" for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="fs-xs text-muted mb-0">&copy; 2026 Village Technology School &mdash; All rights belongs to yogii-tech.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
