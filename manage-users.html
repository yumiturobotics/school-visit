<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Users - School Visit Management System">
  <title>Manage Users | School Visit Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-box"><div class="spinner-border"></div><p>Please wait...</p></div>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <div id="sidebar-overlay"></div>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <div class="brand-text"><div>School Visit</div><div class="brand-sub">Management System</div></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <div class="nav-section-label">Administration</div>
        <a href="manage-schools.html" class="nav-link"><i class="bi bi-building"></i>Manage Schools</a>
        <a href="manage-users.html" class="nav-link active"><i class="bi bi-people"></i>Manage Users</a>
        <a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line"></i>Reports</a>
        <div class="nav-section-label">Account</div>
        <a href="profile.html" class="nav-link"><i class="bi bi-person-circle"></i>Profile</a>
        <button class="nav-link logout-btn text-danger"><i class="bi bi-box-arrow-left"></i>Logout</button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar sidebar-avatar">A</div>
          <div class="user-info">
            <div class="user-name sidebar-username">Admin</div>
            <div class="user-role sidebar-role">Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="topbar-title">Manage Users</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle"><i class="bi bi-moon-fill"></i></button>
        </div>
      </header>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h5>Users</h5>
            <p class="text-muted" id="userCount">Loading...</p>
          </div>
          <button class="btn btn-primary btn-sm" id="addUserBtn"><i class="bi bi-person-plus me-1"></i>Add User</button>
        </div>

        <div class="filter-bar mb-3">
          <div class="search-bar" style="max-width:360px;">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control" id="searchUser" placeholder="Search by name, username, role...">
          </div>
        </div>

        <div class="card-panel">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>User</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="5" class="text-center py-5"><div class="empty-state"><i class="bi bi-hourglass"></i><p>Loading...</p></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="bnav-items">
      <a href="dashboard.html" class="bnav-item"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="manage-schools.html" class="bnav-item"><i class="bi bi-building"></i>Schools</a>
      <a href="manage-users.html" class="bnav-item active"><i class="bi bi-people"></i>Users</a>
      <a href="reports.html" class="bnav-item"><i class="bi bi-bar-chart-line"></i>Reports</a>
      <a href="profile.html" class="bnav-item"><i class="bi bi-person-circle"></i>Profile</a>
    </div>
  </nav>

  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="userModalTitle">Add User</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="userForm" novalidate>
            <input type="hidden" id="editUsername">
            <div class="mb-3">
              <label class="form-label" for="userName">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="userName" placeholder="Enter full name" required>
            </div>
            <div class="mb-3" id="usernameField">
              <label class="form-label" for="userUsername">Username <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="userUsername" placeholder="e.g. log" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="userRole">Role <span class="text-danger">*</span></label>
              <select class="form-select" id="userRole" required>
                <option value="">-- Select Role --</option>
                <option value="Admin">Admin</option>
                <option value="Incharge">Incharge</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="userStatus">Status</label>
              <select class="form-select" id="userStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="mb-3" id="passwordGroup">
              <label class="form-label" for="userPassword">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="userPassword" placeholder="Set a password" autocomplete="new-password">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary btn-sm" id="saveUserBtn">Save User</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title"><i class="bi bi-key me-2"></i>Reset Password</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="resetUsername">
          <p class="fs-sm text-muted mb-3" id="resetUserLabel"></p>
          <div class="mb-3">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary btn-sm" id="savePasswordBtn">Reset Password</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-4 text-center">
          <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:2rem;"></i>
          <p class="mt-2 mb-0 fs-sm" id="confirmMessage">Are you sure?</p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-0">
          <button class="btn btn-sm btn-outline-secondary" id="confirmNoBtn">Cancel</button>
          <button class="btn btn-sm btn-danger" id="confirmYesBtn">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
